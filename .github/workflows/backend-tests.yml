name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    paths: [backend/**]
jobs:
  test:
    runs-on: ubuntu-latest        # GitHub's Linux runners have Docker preinstalled → Testcontainers works
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore 

      - name: Test
        run: dotnet test --no-build
